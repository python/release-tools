parameters:
  BuildToPublish: current

jobs:
- job: Publish_Nuget
  displayName: Publish Nuget packages
  condition: and(succeeded(), ne(variables['SkipNugetPublish'], 'true'))

  workspace:
    clean: all

  steps:
  - checkout: none

  - task: DownloadBuildArtifacts@1
    displayName: 'Download artifact: nuget'
    inputs:
      ${{ if eq(parameters.BuildToPublish, 'current') }}:
        buildType: current
      ${{ else }}:
        buildType: specific
        buildVersionToDownload: specific
        project: $(resources.pipeline.build_to_publish.projectId)
        pipeline: $(resources.pipeline.build_to_publish.pipelineId)
        runId: $(resources.pipeline.build_to_publish.runID)
      artifactName: nuget
      downloadPath: $(Build.BinariesDirectory)

  - powershell: 'gci pythonarm*.nupkg | %{ Write-Host "Not publishing: $($_.Name)"; gi $_ } | del'
    displayName: 'Prevent publishing ARM64 packages'
    workingDirectory: '$(Build.BinariesDirectory)\nuget'
    condition: and(succeeded(), ne(variables['PublishARM64'], 'true'))

  - powershell: |
      $serviceIndex = Invoke-RestMethod -Uri 'https://api.nuget.org/v3/index.json' -ErrorAction Stop
      $api = $serviceIndex.resources |
          Where-Object { $_.'@type' -eq 'PackageBaseAddress/3.0.0' } |
          Select-Object -First 1 -ExpandProperty '@id'
      if (-not $api) {
          throw 'Could not find the NuGet package base address'
      }

      foreach ($package in Get-ChildItem -Filter '*.nupkg' -File) {
          if ($package.BaseName -notmatch '^([^.]+)\.(.+)$') {
              throw "Could not determine the package ID and version from $($package.Name)"
          }
          $packageId = $Matches[1].ToLowerInvariant()
          $packageVersion = $Matches[2].ToLowerInvariant()

          try {
              $versionsUri = "$api$packageId/index.json"
              $versions = (Invoke-RestMethod -Uri $versionsUri -ErrorAction Stop).versions
          } catch {
              if ([int]$_.Exception.Response.StatusCode -eq 404) {
                  continue
              }
              throw
          }

          if ($versions -contains $packageVersion) {
              Write-Host "Already published: $($package.Name)"
              Remove-Item -LiteralPath $package.FullName
          }
      }
    displayName: 'Skip already published NuGet packages'
    workingDirectory: '$(Build.BinariesDirectory)\nuget'

  - task: NuGetCommand@2
    displayName: Push packages
    condition: and(succeeded(), eq(variables['IsRealSigned'], 'true'))
    inputs:
      command: push
      packagesToPush: '$(Build.BinariesDirectory)\nuget\*.nupkg'
      nuGetFeedType: external
      publishFeedCredentials: 'Python on Nuget'
      requestTimeout: 600
